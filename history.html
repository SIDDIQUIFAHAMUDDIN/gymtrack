                GYM<span>TRACK</span>
            </a>

            <!-- Mobile Menu Button -->
            <button id="menuBtn" class="menu-btn">

            </button>

            <!-- Navigation -->

                <a href="index.html">

                <a href="dashboard.html">

                    HISTORY
                </span>

                    Workout History
                </h2>

                </p>

            <!-- Clear History Button -->

            <button

        <!-- ================= HISTORY LIST ================= -->

        <section>

                class="list"
