<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Plan | GymTrack</title>
    <title>Diet & Nutrition Plan | GymTrack</title>

<meta name="description"
content="Explore nutrition information and diet planning features with GymTrack to support your fitness routine.">

<meta name="robots" content="index, follow">

<link rel="canonical"
href="https://siddiquifahamuddin.github.io/gymtrack/diet.html">

<link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="style.css">

    <style>
        .diet-page {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .diet-hero {
            margin-bottom: 30px;
        }

        .diet-hero span {
            color: #ff8a3d;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 13px;
        }

        .diet-hero h1 {
            font-size: clamp(35px, 5vw, 58px);
            margin: 8px 0;
        }

        .diet-hero p {
            color: #aaa;
        }

        .diet-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .diet-search {
            flex: 1;
            min-width: 220px;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #171717;
            color: white;
            outline: none;
        }

        .diet-filter {
            padding: 12px 18px;
            border: 1px solid #444;
            border-radius: 12px;
            background: #171717;
            color: white;
            cursor: pointer;
        }

        .diet-filter.active {
            background: #ff8a3d;
            color: white;
            border-color: #ff8a3d;
        }

        .nutrition-summary {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .nutrition-box {
            background: linear-gradient(145deg, #202020, #141414);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
        }

        .nutrition-box small {
            color: #999;
        }

        .nutrition-box strong {
            display: block;
            font-size: 25px;
            margin-top: 8px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .food-card {
            background: #171717;
            border: 1px solid #333;
            border-radius: 18px;
            overflow: hidden;
            transition: 0.25s;
        }

        .food-card:hover {
            transform: translateY(-5px);
            border-color: #ff8a3d;
        }

        .food-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .food-content {
            padding: 20px;
        }

        .food-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .food-top h3 {
            margin: 0;
        }

        .food-price {
            color: #ff9b58;
            font-weight: 700;
            white-space: nowrap;
        }

        .food-serving {
            color: #999;
            margin: 6px 0 15px;
        }

        .nutrient-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .nutrient {
            background: #222;
            border-radius: 9px;
            padding: 9px;
            font-size: 13px;
        }

        .nutrient b {
            color: white;
        }

        .food-category {
            display: inline-block;
            font-size: 11px;
            background: #292929;
            color: #ff9b58;
            padding: 5px 9px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .creatine-note {
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            background: #24201c;
            color: #ffc39d;
            font-size: 12px;
        }

        .add-food {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: #ff8a3d;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .add-food:hover {
            background: #ff7620;
        }

        .today-section {
            margin-top: 45px;
            padding: 25px;
            background: #171717;
            border: 1px solid #333;
            border-radius: 18px;
        }

        .today-list {
            margin-top: 20px;
        }

        .today-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #333;
        }

        .remove-food {
            border: 0;
            background: #392020;
            color: #ff8b8b;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty-diet {
            color: #888;
            padding: 15px 0;
        }

        @media (max-width: 900px) {
            .food-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nutrition-summary {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .food-grid {
                grid-template-columns: 1fr;
            }

            .nutrition-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .diet-page {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">GYM<span>TRACK</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="workout.html">Workouts</a>
            <a href="diet.html" class="active">Diet</a>
            <a href="progress.html">Progress</a>
            <a href="quotes.html">quotes</a>
        </nav>
    </header>

    <main class="diet-page">

        <section class="diet-hero">
            <span>NUTRITION TRACKER</span>
            <h1>Diet Plan</h1>
            <p>Explore foods, nutrition information and build your daily food list.</p>
        </section>

        <div class="diet-controls">
            <input
                type="text"
                id="foodSearch"
                class="diet-search"
                placeholder="🔍 Search eggs, chicken, paneer..."
            >

            <button class="diet-filter active" data-category="all">All</button>
            <button class="diet-filter" data-category="protein">Protein</button>
            <button class="diet-filter" data-category="veg">Vegetarian</button>
            <button class="diet-filter" data-category="dairy">Dairy</button>
            <button class="diet-filter" data-category="nuts">Nuts & Seeds</button>
            <button class="diet-filter" data-category="creatine">Natural Creatine</button>
        </div>

        <section class="nutrition-summary">

            <div class="nutrition-box">
                <small>Calories</small>
                <strong id="totalCalories">0</strong>
                <small>kcal</small>
            </div>

            <div class="nutrition-box">
                <small>Protein</small>
                <strong id="totalProtein">0</strong>
                <small>g</small>
            </div>

            <div class="nutrition-box">
                <small>Carbs</small>
                <strong id="totalCarbs">0</strong>
                <small>g</small>
            </div>

            <div class="nutrition-box">
                <small>Fat</small>
                <strong id="totalFat">0</strong>
                <small>g</small>
            </div>

            <div class="nutrition-box">
                <small>Fiber</small>
                <strong id="totalFiber">0</strong>
                <small>g</small>
            </div>

        </section>

        <section id="foodGrid" class="food-grid"></section>

        <section class="today-section">

            <h2>Today's Diet</h2>
            <p>Add foods above to keep a simple record of what you've eaten.</p>

            <div id="todayList" class="today-list"></div>

        </section>

    </main>

    <script src="diet.js"></script>

</body>
</html>
